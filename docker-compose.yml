services:
  api:
    build: .
    container_name: examblue-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - LITELLM_LOCAL_MODEL_COST_MAP=True
    depends_on:
      - mongo
    restart: unless-stopped

  adk-web:
    build: .
    container_name: examblue-adk-web
    command: ["adk", "web", "--host", "0.0.0.0", "--port", "8001", "app/agents"]
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - LITELLM_LOCAL_MODEL_COST_MAP=True
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: examblue-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
